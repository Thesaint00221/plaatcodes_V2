<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cases overzicht | Plaatcodes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon.ico">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="style.min.css">
    <link rel="stylesheet" href="phase3.css">
    <style>
        #casesLijst{width:100%;min-width:0;}
        .caseRij{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;max-width:100%;box-sizing:border-box;padding:16px 18px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text);text-decoration:none;overflow:hidden;}
        .caseRijInfo{min-width:0;overflow:hidden;}
        .caseRijInfo strong,.caseRijTitel{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .caseRijMeta{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-width:0;flex-wrap:wrap;font-size:12px;color:var(--text-light);}
        .caseRijMeta span{white-space:nowrap;}
        .caseRijCode{color:var(--text-light);font-weight:500;font-size:11px;letter-spacing:.06em;}
        @media(max-width:600px){
            .caseRij{grid-template-columns:auto minmax(0,1fr);gap:10px;padding:14px 12px;margin-bottom:8px;}
            .caseRijMeta{grid-column:1 / -1;justify-content:flex-start;gap:8px;padding-left:0;font-size:11px;}
            .caseRijInfo strong,.caseRijTitel{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;}
            .caseRijInfo strong{line-height:1.35;}
            .caseRijTitel{margin-top:3px;line-height:1.45;}
            .caseTypeKeuze{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
            .caseTypeKnop{min-width:0;padding:11px 8px;font-size:13px;}
        }
        @media(max-width:380px){
            .caseTypeKeuze{grid-template-columns:1fr;}
        }
    </style>
</head>
<body class="beheerPagina">
<header class="beheerTopbar">
    <a class="beheerMerk" href="index.html">
        <img src="images/logo-detremmerie.png" alt="Detremmerie" class="merkLogo">
        <span>Plaatcodes</span>
    </a>
    <div id="loginBox" class="loginArea"></div>
</header>
<main class="beheer-container">
<div class="beheerIntro">
    <p class="beheerEyebrow">Geschiedenis</p>
    <h1><span class="icoon" data-icon="lagen"></span> Cases overzicht</h1>
    <p>Alle cases op één plek, nieuwste eerst — zonder te moeten zoeken in de catalogus.</p>
</div>
<div class="caseTypeKeuze" id="overzichtFilter">
    <button type="button" class="caseTypeKnop actief" data-filter="">Alle cases</button>
    <button type="button" class="caseTypeKnop" data-filter="productie"><span class="icoon" data-icon="fabriek"></span> Productie</button>
    <button type="button" class="caseTypeKnop" data-filter="leverancier"><span class="icoon" data-icon="vrachtwagen"></span> Leverancier</button>
    <button type="button" class="caseTypeKnop" data-filter="aankoop"><span class="icoon" data-icon="document"></span> Aankoopklachten</button>
</div>
<div id="casesLijst"></div>
<div id="casesLaadMeer" class="laadMeer hidden">Meer cases laden...</div>
<a class="beheerTerug" href="index.html"><span class="icoon" data-icon="pijl-links"></span> Terug naar catalogus</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/icons.js"></script>
<script src="js/wachtwoord-toggle.js"></script>
<script src="js/dropdown-sluiten.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/overzicht.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
